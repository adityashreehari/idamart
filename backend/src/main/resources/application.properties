spring.application.name=idamart-backend
# Render (and most cloud hosts) pass the port in the PORT variable; 8080 on your laptop
server.port=${PORT:8080}

# ---------- MySQL ----------
# ${DB_PASSWORD:root} means: use the DB_PASSWORD environment variable if it
# exists, otherwise fall back to "root". So the real password never has to be
# written in this file (safe to push to GitHub).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/idamart_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# A small connection pool is plenty for this app and saves memory on a 512 MB server
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Load lazy collections (like each order's items) in batches instead of one query per row
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# ---------- JWT ----------
# Signing key for tokens. The default is for local development only;
# a different secret is set as an environment variable when deployed (Session 10).
app.jwt.secret=${JWT_SECRET:jua3DilhQJBxmytTG5cBY9lo8q2UFeYX1IifAf9srcNADnT/JnHIkeX9pmYpkDXp}
# 86400000 ms = 24 hours
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- First admin account (created on startup if missing) ----------
app.admin.name=${ADMIN_NAME:IdaMart Admin}
app.admin.email=${ADMIN_EMAIL:admin@idamart.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# ---------- Demo catalogue (categories + products added on startup if missing) ----------
app.seed.enabled=${SEED_DATA:true}

# ---------- Frontend (React dev server, used for CORS) ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
