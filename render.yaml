# ---------------------------------------------------------------
# Render Blueprint: describes BOTH IdaMart services so Render can create them in one go.
# Render dashboard → New → Blueprint → pick this GitHub repo.
#
# Values marked "sync: false" are secrets/URLs you type in the dashboard (never commit them).
# See docs/DEPLOYMENT.md for the full walkthrough.
# ---------------------------------------------------------------
services:
  # ---------- Spring Boot API (Docker) ----------
  - type: web
    name: idamart-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/categories
    envVars:
      - key: DB_URL            # TiDB Cloud JDBC URL (see DEPLOYMENT.md)
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD    # a strong password for admin@idamart.com in production
        sync: false
      - key: CORS_ORIGINS      # the website's address, e.g. https://idamart-web.onrender.com
        sync: false
      - key: JWT_SECRET        # Render generates a random 256-bit base64 key
        generateValue: true

  # ---------- React website (static files) ----------
  - type: web
    name: idamart-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      # Single-page app: every path (/products/4, /cart, /admin…) is served index.html,
      # and React Router shows the right page.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL      # the API's address, e.g. https://idamart-api.onrender.com
        sync: false
      - key: NODE_VERSION
        value: "24"
